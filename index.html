<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baltaanay Creator Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="min-h-full flex flex-col font-sans bg-slate-950 text-slate-100">
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white">C</span>
        <span class="font-extrabold text-lg">Baltaanay Creator</span>
      </div>
      <div class="flex items-center space-x-3">
        <button onclick="CreatorApp.openEditor()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-xs font-semibold text-white">
          <i class="fa-solid fa-feather mr-2"></i> Escribir Blog
        </button>
        <button onclick="CreatorApp.openAdminKing()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs text-slate-300">
          <i class="fa-solid fa-crown text-amber-400 mr-1"></i> Panel King
        </button>
      </div>
    </div>
  </header>

  <main id="creator-viewport" class="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
    <!-- Contenido Dinámico de Creator Studio -->
  </main>

  <script src="creator-service.js"></script>
  <script src="editorblog.js"></script>
  <script src="king.js"></script>
  <script src="creator-main.js"></script>
</body>
</html>
